<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#12112a"/>

  <!-- Crown: left facet (darker) -->
  <polygon points="12,5 3,14 14,14" fill="#5e56b8"/>
  <!-- Crown: right facet (medium) -->
  <polygon points="20,5 18,14 29,14" fill="#8880e0"/>
  <!-- Crown: center facet (lightest — catching direct light) -->
  <polygon points="12,5 20,5 18,14 14,14" fill="#a89ee8"/>

  <!-- Pavilion: left facet (darkest — in shadow) -->
  <polygon points="3,14 14,14 16,28" fill="#3a3490"/>
  <!-- Pavilion: right facet (medium dark) -->
  <polygon points="18,14 29,14 16,28" fill="#6258c4"/>
  <!-- Pavilion: center highlight (bright internal reflection) -->
  <polygon points="14,14 18,14 16,22" fill="#d8d2fa"/>
</svg>
